 offsite\n(tools/)" as Script</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="261" x="5" y="176.5433">database "backups/\n(local)" as Local</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="206" x="5" y="195.6113">participant "rclone" as Rclone</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="270" x="5" y="214.6792">cloud "Google Drive\ndu club" as Drive</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="93" x="9" y="233.7471">Syntax Error?</text><!--MD5=[02815acab51b6b8b2e2b4c790f1879ea]
@startuml sauvegarde_hors_site_flow
skinparam sequenceMessageAlign center
skinparam maxMessageSize 160

actor "Cron\n(hebdomadaire)" as Cron
participant "Script offsite\n(tools/)" as Script
database "backups/\n(local)" as Local
participant "rclone" as Rclone
cloud "Google Drive\ndu club" as Drive
participant "Relais SMTP" as Smtp
actor "Club\n(email)" as Club
database "logfile.txt\n(local)" as Log

Cron -> Script : déclenche l'exécution
Script -> Local : repère la dernière sauvegarde DB (*.zip)\net la dernière sauvegarde média (*.tar.gz)
Script -> Rclone : copy sauvegarde DB
Rclone -> Drive : upload
Rclone - -> Script : code retour

Script -> Rclone : copy sauvegarde média
Rclone -> Drive : upload
Rclone - -> Script : code retour

Script -> Rclone : delete (fichiers > 2 mois)
Rclone -> Drive : purge rétention

alt échec DB et/ou média
    Script -> Smtp : envoi alerte (détail du type en échec)
    Smtp -> Club : email d'échec
else succès complet
    note right of Script : aucune notification envoyée
end

Script -> Log : trace le résultat (succès/échec, partagé\navec autobackup.py / autobackup_media.py)

@enduml

